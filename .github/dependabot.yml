version: 2
updates:
  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # NuGet entra na fase 2, quando src/api existir.
