name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions fixadas por SHA, não por tag móvel (§7.2 / A08).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes + cobertura
        # O gate de 90% no domínio está em vite.config.ts (§6.6);
        # o Vitest falha sozinho se a cobertura ficar abaixo.
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A config do Playwright faz o build e sobe o preview sozinha: o E2E
      # precisa do bundle de produção, onde o service worker existe.
      - run: npm run test:e2e

  api:
    name: Back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # --locked-mode: nenhuma versão entra por resolução silenciosa; o lockfile manda (§7.2/A08).
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Formatação
        run: dotnet format --verify-no-changes --no-restore
      - name: Testes de domínio + cobertura
        run: >
          dotnet test Tomatempo.Domain.Tests/Tomatempo.Domain.Tests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./cobertura
      # Gate de 90% em linha e branch no domínio (§6.6). O resto é medido, não barra.
      - name: Gate de cobertura do domínio
        run: python3 ../../.github/scripts/gate_cobertura.py cobertura 90
      # Os testes de contrato sobem Postgres real via Testcontainers; o runner já tem Docker.
      - name: Testes de contrato
        run: dotnet test Tomatempo.Api.Tests/Tomatempo.Api.Tests.csproj --no-build --configuration Release
      - name: Auditoria de dependências (falha em alta ou crítica)
        run: |
          dotnet list package --vulnerable --include-transitive > vulneraveis.txt
          cat vulneraveis.txt
          if grep -qE "High|Critical" vulneraveis.txt; then
            echo "::error::dependência com vulnerabilidade alta ou crítica"
            exit 1
          fi

  e2e-api:
    name: E2E fase 2 (API + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tomatempo_e2e
          POSTGRES_USER: tomatempo
          # Senha efêmera, única por execução: o banco vive minutos dentro da rede
          # do job e é destruído com ele. Nada aqui é segredo reaproveitável (§7.5).
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tomatempo -d tomatempo_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # O cadastro manda e-mail de confirmação; sem SMTP escutando, o endpoint estoura.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Restore da API
        run: dotnet restore --locked-mode
        working-directory: src/api
      - run: npm ci
        working-directory: src/web
      - run: npx playwright install --with-deps chromium
        working-directory: src/web
      # A config do Playwright sobe a API e o preview do bundle de produção, e a
      # migração roda na subida da API (§10).
      - name: E2E da fase 2
        run: npm run test:e2e:api
        working-directory: src/web
        env:
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-e2e-api
          path: src/web/test-results
          retention-days: 7

  codeql-csharp:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: csharp
          # Sem compilar: a análise lê o fonte, e o build já roda no job do back-end.
          build-mode: none
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  dependencies:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
      - name: npm audit (falha em alta ou crítica)
        working-directory: src/web
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
