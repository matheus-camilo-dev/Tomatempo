# Configuração do gitleaks — Tomatempo
# Ver docs/ESPECIFICACAO-TECNICA.md §7.5
#
# Roda em dois lugares: hook de pre-commit (local) e CI (action oficial).
# O repositório é público desde o commit 1, então um segredo que passe daqui
# está comprometido de forma permanente, mesmo que removido depois.

[extend]
useDefault = true

[[rules]]
id = "postgres-connection-string"
description = "Connection string de Postgres com senha embutida"
regex = '''(?i)(postgres(ql)?://[^:\s]+:[^@\s]+@)'''
tags = ["database", "credential"]

[[rules]]
id = "dotnet-connection-string"
description = "Connection string .NET com Password/Pwd preenchido"
# RE2 (engine do gitleaks) não suporta lookahead: os valores falsos são
# excluídos pelo [allowlist] abaixo, não por (?!...).
regex = '''(?i)(password|pwd)\s*=\s*[^\s;"']{6,}'''
tags = ["database", "credential"]

  [[rules.allowlists]]
  # `Password=${VAR}` em compose e script: por construção não carrega segredo algum, o valor
  # vem do ambiente. A forma com valor embutido (`${VAR:-senha}`) fica de fora de propósito,
  # e continua sendo pega — verificado com caso de regressão antes de entrar aqui.
  regexTarget = "match"
  regexes = ['''(?i)(password|pwd)\s*=\s*\$\{[A-Za-z_][A-Za-z0-9_]*(:\?[^}]*)?\}$''']

[allowlist]
description = "Valores propositalmente falsos e artefatos de teste"
paths = [
  '''\.gitleaks\.toml$''',
  '''\.env\.example$''',
  '''(^|/)docs/''',
]
# Os marcadores precisam aparecer como palavra, e não como pedaço de outra: `changeme` e
# `fake-client-id` passam; um segredo de verdade que por acaso contenha essas letras no meio
# de um token, não. Antes era substring solta, o que deixava `...livefakeXYZ...` passar.
regexes = [
  '''(?i)(^|[^a-z0-9])(changeme|dummy|placeholder|fake)([^a-z0-9]|$)''',
  '''your[-_]?(client[-_]?secret|api[-_]?key|password)''',
  '''@example\.com''',
]
